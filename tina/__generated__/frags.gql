fragment SiteParts on Site {
  __typename
  studioName
  stylistName
  credentials
  title
  browserTitle
  description
  metaDescription
  keywords
  email
  phone
  emailFallback
  phoneFallback
  instagramHandle
  locationDisplay
  availabilityBanner
  logisticsNotice
  calUsername
  calDefaultSlug
  address {
    __typename
    locality
    region
    country
  }
  geo {
    __typename
    latitude
    longitude
  }
  areaServed
  openingDays
  openingHours {
    __typename
    opens
    closes
  }
  priceRange
  heroHeading
  heroSubtext
  ogImageRelative
  ogImageFallbackRelative
  ogImageAlt
  ogImageWidth
  ogImageHeight
  heroPreloadImage
  portfolioImagesRelative
}

fragment HeroParts on Hero {
  __typename
  badge
  headline
  subheading
  availabilityNotice
  calSlug
}

fragment PortfolioParts on Portfolio {
  __typename
  portfolioList {
    __typename
    id
    image
    alt
    tag
  }
}

fragment ServicesParts on Services {
  __typename
  sectionTitle
  servicesList {
    __typename
    id
    name
    price
    duration
    description
    deliverables
    calSlug
  }
}

fragment EventsParts on Events {
  __typename
  title
  description
  showForm
  formFields {
    __typename
    ... on EventsFormFieldsInputField {
      label
      fieldType
      placeholder
      required
    }
    ... on EventsFormFieldsSelectField {
      label
      options
      required
    }
    ... on EventsFormFieldsTextareaField {
      label
      placeholder
      required
    }
  }
  formOptions {
    __typename
    submitButtonText
  }
}
